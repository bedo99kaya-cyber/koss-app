<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#f97316" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="8" stdDeviation="28" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Box -->
  <rect x="96" y="96" width="320" height="320" rx="90" fill="url(#borderGrad)" opacity="0.45" filter="url(#ambientGlow)" />

  <!-- Outer Squircle Card -->
  <rect x="56" y="56" width="400" height="400" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />
  
  <!-- Inner Glass Highlight -->
  <rect x="72" y="72" width="368" height="184" rx="84" fill="#ffffff" opacity="0.04" />

  <!-- Lightning Bolt (Zap) -->
  <path d="M280 120 L180 270 L260 270 L232 392 L332 242 L252 242 Z" 
        fill="url(#boltGrad)" 
        filter="url(#glow)" 
        stroke="#fef08a" 
        stroke-width="4" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- Live Pulse Dot -->
  <circle cx="370" cy="142" r="16" fill="#fb923c" opacity="0.4" />
  <circle cx="370" cy="142" r="9" fill="#f97316" stroke="#ffffff" stroke-width="2.5" />
</svg>
